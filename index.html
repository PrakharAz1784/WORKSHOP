<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book store</title>
    <style>
        .header {
            background: orange;
            height: 70px;
            font-size: 30px;
            display: flex;
            align-items: center;
        }
        
        .logo {
            width: 120px;
            text-align: center;
        }
        
        .title {
            font-weight: bold;
            flex: 1;
            text-align: center;
        }
        
        .menu {
            background: rgb(216, 182, 108);
            display: flex;
        }
        
        .menu a {
            text-decoration: none;
            color: red;
            font-weight: bold;
        }
        
        .menu {
            display: flex;
            background: pink;
            height: 50px;
            justify-content: space-around;
            align-items: center;
        }
        
        .main {
            display: flex;
            height: 400px;
        }
        
        .left {
            width: 200px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
        }
        
        .left a {
            text-decoration: none;
            color: black;
            padding: 8px;
        }
        
        .right {
            flex: 1;
            border: 1px solid black;
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
        }
        
        .right iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="https://www.glbitm.org/images/logo.png" alt="GL Bajaj Logo">
        </div>
        <div class="title">Website name</div>
    </div>
    <div class="menu">
        <a href="">Home</a>
        <a href="">Login</a>
        <a href="">Registration</a>
        <a href="">Catalogue</a>
        <a href="">Cart</a>
    </div>
    <div class="main">
        <div class="left">
            <a href="cse.html" target="content">CSE</a>
            <a href="ece.html" target="content">ECE</a>
            <a href="eee.html" target="content">EEE</a>
            <a href="civil.html" target="content">CIVIL</a>
        </div>
        <div class="right">

            <iframe src="home.html" name="content">
            </iframe>

        </div>
    </div>
</body>

</html>
